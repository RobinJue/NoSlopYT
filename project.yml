name: NoSlop

options:
  bundleIdPrefix: com.robinjungerich
  deploymentTarget:
    iOS: "18.0"
  # Synced folders: adding or removing files under NoSlop/ never changes NoSlop.xcodeproj.
  defaultSourceDirectoryType: syncedFolder

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  NoSlopKit:
    path: NoSlopKit

targets:
  NoSlop:
    type: application
    platform: iOS
    sources:
      - NoSlop
    dependencies:
      - package: NoSlopKit
    # Signing (DEVELOPMENT_TEAM) comes from Config/Base.xcconfig -> Config/Local.xcconfig, so it is not set below.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinjungerich.noslopyt
        INFOPLIST_KEY_CFBundleDisplayName: "No Slop"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    # XcodeGen writes these into Config/Info.plist; Xcode merges them with the INFOPLIST_KEY_* settings above
    # (GENERATE_INFOPLIST_FILE). The file lives outside the synced NoSlop/ folder so it is not copied as a resource.
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # One window only. The router, the player and Picture in Picture are process-wide: a second window (iPadOS "New
        # Window", App Exposé, "Designed for iPad" on a Mac) would show and steer the same navigation and the same player.
        # This replaces INFOPLIST_KEY_UIApplicationSceneManifest_Generation, which makes Xcode write
        # UIApplicationSupportsMultipleScenes = true. Split View and Slide Over with other apps are not affected.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.robinjungerich.noslopyt
            CFBundleURLSchemes:
              - noslop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

schemes:
  NoSlop:
    build:
      targets:
        NoSlop: all
    run:
      config: Debug
      commandLineArguments:
        # Tick this in Xcode (Product > Scheme > Edit Scheme > Run > Arguments) to run on the mock services.
        "-mockServices YES": false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
