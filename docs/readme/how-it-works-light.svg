<text x="504" y="413" font-size="17" font-weight="600" fill="#1F2328" text-anchor="start">YouTube connection</text>
<text x="504" y="432" font-size="13.5" font-weight="400" fill="#59636E" text-anchor="start">YouTube's own Home for your account.</text>
