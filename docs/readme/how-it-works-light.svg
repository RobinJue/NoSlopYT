<polygon points="430,332 420,326 420,338" fill="#8C959F"/>
<path d="M270,246 C350,246 350,418 421,418" fill="none" stroke="#8C959F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<polygon points="430,418 420,412 420,424" fill="#8C959F"/>
<circle cx="270" cy="246" r="5" fill="#D93635"/>
<rect x="0.5" y="96.5" width="269" height="299" rx="18" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/>
<rect x="24" y="120" width="56" height="56" rx="14" fill="#E0393B"/>
<polygon points="46,136 46,160 65,148" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
<path d="M69 128Q69 134 75 134Q69 134 69 140Q69 134 63 134Q69 134 69 128Z" fill="#FFFFFF"/>
<text x="96" y="146" font-size="22" font-weight="700" fill="#1F2328" text-anchor="start">No Slop</text>
<text x="96" y="168" font-size="14" font-weight="400" fill="#59636E" text-anchor="start">on your iPhone or iPad</text>
<line x1="24" y1="196" x2="246" y2="196" stroke="#D1D9E0" stroke-width="1"/>
<text x="24" y="221" font-size="11.5" font-weight="700" fill="#59636E" text-anchor="start" letter-spacing="1.1">KEPT ON THE DEVICE</text>
<text x="24" y="246" font-size="14.5" font-weight="400" fill="#1F2328" text-anchor="start">Subscriptions, history,</text>
<text x="24" y="266" font-size="14.5" font-weight="400" fill="#1F2328" text-anchor="start">Watch Later, playlists</text>
<text x="24" y="286" font-size="14.5" font-weight="400" fill="#1F2328" text-anchor="start">and downloads.</text>
<line x1="24" y1="312" x2="246" y2="312" stroke="#D1D9E0" stroke-width="1"/>
<g transform="translate(24 326) scale(0.833333)" fill="none" stroke="#D93635" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
<text x="54" y="341" font-size="14.5" font-weight="600" fill="#1F2328" text-anchor="start">Everything runs here</text>
<g transform="translate(24 356) scale(0.833333)" fill="none" stroke="#D93635" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
<text x="54" y="371" font-size="14.5" font-weight="600" fill="#1F2328" text-anchor="start">No account needed</text>
