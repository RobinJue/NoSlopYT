<text x="504" y="327" font-size="17" font-weight="600" fill="#1F2328" text-anchor="start">Google sign-in</text>
<text x="504" y="346" font-size="13.5" font-weight="400" fill="#59636E" text-anchor="start">Your subscriptions, playlists and likes.</text>
<rect x="709.75" y="304.5" width="77.75" height="19" rx="10" fill="#FFFFFF" stroke="#8C959F" stroke-width="1"/>
