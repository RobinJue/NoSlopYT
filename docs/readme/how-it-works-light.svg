<text x="504" y="145.5" font-size="17" font-weight="600" fill="#1F2328" text-anchor="start">SponsorBlock</text>
<text x="504" y="164.5" font-size="13.5" font-weight="400" fill="#59636E" text-anchor="start">Sponsor segments to skip.</text>
<text x="504" y="183.5" font-size="13.5" font-weight="400" fill="#59636E" text-anchor="start">Only a short hash of the video ID is sent.</text>
<rect x="430.5" y="208.5" width="369" height="75" rx="14" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/>
