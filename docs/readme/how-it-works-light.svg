<text x="504" y="231.5" font-size="17" font-weight="600" fill="#1F2328" text-anchor="start">DeArrow</text>
<text x="504" y="250.5" font-size="13.5" font-weight="400" fill="#59636E" text-anchor="start">Plain titles for videos.</text>
