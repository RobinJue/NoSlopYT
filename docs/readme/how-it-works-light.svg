<svg xmlns="http://www.w3.org/2000/svg" width="800" height="536" viewBox="0 0 800 536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How No Slop works</title>
<desc id="d">No Slop runs on your phone and talks directly to YouTube, SponsorBlock and DeArrow. Google sign-in and the YouTube connection are optional. There is no No Slop server, no analytics, no tracking and no third-party code.</desc>
<text x="0" y="22" font-size="12" font-weight="700" fill="#59636E" text-anchor="start" letter-spacing="1.2">ON YOUR PHONE</text>
<text x="350" y="22" font-size="12" font-weight="700" fill="#59636E" text-anchor="middle" letter-spacing="1.2">DIRECT</text>
<text x="430" y="22" font-size="12" font-weight="700" fill="#59636E" text-anchor="start" letter-spacing="1.2">THE ONLY PLACES IT TALKS TO</text>
<path d="M270,246 C350,246 350,74 421,74" fill="none" stroke="#D93635" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="430,74 420,68 420,80" fill="#D93635"/>
