<svg xmlns="http://www.w3.org/2000/svg" width="800" height="604" viewBox="0 0 800 604" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Install in five steps</title>
<desc id="d">Five steps: a Mac with Xcode; your Apple ID and Team ID; a bundle ID of your own; Developer Mode on your iPhone; Run, then Trust. With a free Apple ID the app keeps working for 7 days.</desc>
<line x1="28" y1="61" x2="28" y2="121" stroke="#3D444D" stroke-width="2"/>
<circle cx="28" cy="42" r="18" fill="#FF6B66"/>
<text x="28" y="48.5" font-size="18" font-weight="700" fill="#0D1117" text-anchor="middle">1</text>
<rect x="68.5" y="0.5" width="731" height="83" rx="14" fill="#151B23" stroke="#3D444D" stroke-width="1"/>
<rect x="86" y="14" width="56" height="56" rx="14" fill="#3A1A1C"/>
<g transform="translate(96 24) scale(1.5)" fill="none" stroke="#FF6B66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g>
<text x="162" y="32" font-size="19" font-weight="600" fill="#F0F6FC" text-anchor="start">Mac with Xcode</text>
<text x="162" y="53" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="start">Xcode 26.2 or newer, free in the Mac App Store.</text>
<text x="162" y="71" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="start">Your iPhone or iPad needs iOS 18 or newer, and a cable.</text>
<line x1="28" y1="159" x2="28" y2="219" stroke="#3D444D" stroke-width="2"/>
<circle cx="28" cy="140" r="18" fill="#FF6B66"/>
<text x="28" y="146.5" font-size="18" font-weight="700" fill="#0D1117" text-anchor="middle">2</text>
<rect x="68.5" y="98.5" width="731" height="83" rx="14" fill="#151B23" stroke="#3D444D" stroke-width="1"/>
<rect x="86" y="112" width="56" height="56" rx="14" fill="#3A1A1C"/>
<g transform="translate(96 122) scale(1.5)" fill="none" stroke="#FF6B66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M5.8 16c.6-1.6 1.9-2.4 3.2-2.4s2.6.8 3.2 2.4"/><path d="M14.5 10h4M14.5 14h4"/></g>
<text x="162" y="130" font-size="19" font-weight="600" fill="#F0F6FC" text-anchor="start">Apple ID and Team ID</text>
<text x="162" y="151" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="start">Add your Apple ID in Xcode (a free one is enough).</text>
<text x="162" y="169" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="start">Then put its ten-character Team ID in Config/Local.xcconfig.</text>
<line x1="28" y1="257" x2="28" y2="317" stroke="#3D444D" stroke-width="2"/>
<circle cx="28" cy="238" r="18" fill="#FF6B66"/>
<text x="28" y="244.5" font-size="18" font-weight="700" fill="#0D1117" text-anchor="middle">3</text>
<rect x="68.5" y="196.5" width="731" height="83" rx="14" fill="#151B23" stroke="#3D444D" stroke-width="1"/>
<rect x="86" y="210" width="56" height="56" rx="14" fill="#3A1A1C"/>
<g transform="translate(96 220) scale(1.5)" fill="none" stroke="#FF6B66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5"/><path d="M12 12v9"/></g>
<text x="162" y="228" font-size="19" font-weight="600" fill="#F0F6FC" text-anchor="start">A bundle ID of your own</text>
<text x="162" y="249" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="start">Apple allows each bundle ID on one team only.</text>
<text x="162" y="267" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="start">In Xcode, set Bundle Identifier to something yours, like com.yourname.noslop.</text>
<line x1="28" y1="355" x2="28" y2="415" stroke="#3D444D" stroke-width="2"/>
<circle cx="28" cy="336" r="18" fill="#FF6B66"/>
<text x="28" y="342.5" font-size="18" font-weight="700" fill="#0D1117" text-anchor="middle">4</text>
<rect x="68.5" y="294.5" width="731" height="83" rx="14" fill="#151B23" stroke="#3D444D" stroke-width="1"/>
<rect x="86" y="308" width="56" height="56" rx="14" fill="#3A1A1C"/>
<g transform="translate(96 318) scale(1.5)" fill="none" stroke="#FF6B66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.6 9.5L8.9 12l1.7 2.5"/><path d="M13.4 9.5l1.7 2.5-1.7 2.5"/></g>
<text x="162" y="326" font-size="19" font-weight="600" fill="#F0F6FC" text-anchor="start">iPhone Developer Mode</text>
<text x="162" y="347" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="start">Plug it in, unlock it, and tap Trust This Computer if it asks.</text>
<text x="162" y="365" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="start">Then turn on Settings &gt; Privacy &amp; Security &gt; Developer Mode and restart.</text>
<circle cx="28" cy="434" r="18" fill="#FF6B66"/>
<text x="28" y="440.5" font-size="18" font-weight="700" fill="#0D1117" text-anchor="middle">5</text>
<rect x="68.5" y="392.5" width="731" height="83" rx="14" fill="#151B23" stroke="#3D444D" stroke-width="1"/>
<rect x="86" y="406" width="56" height="56" rx="14" fill="#3A1A1C"/>
<g transform="translate(96 416) scale(1.5)" fill="none" stroke="#FF6B66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.2c0 4.3-2.9 7.6-7 9.8-4.1-2.2-7-5.5-7-9.8V6z"/><path d="M8.8 12l2.4 2.4 4-4.4"/></g>
<text x="162" y="424" font-size="19" font-weight="600" fill="#F0F6FC" text-anchor="start">Run, then Trust</text>
<text x="162" y="445" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="start">Press Run (⌘R) in Xcode. The first build takes a few minutes.</text>
<text x="162" y="463" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="start">Then trust your Apple ID under Settings &gt; General &gt; VPN &amp; Device Management.</text>
<rect x="0.5" y="500.5" width="799" height="103" rx="14" fill="#2A1618" stroke="#5A2A2C" stroke-width="1"/>
<g transform="translate(22 522) scale(1.33333)" fill="none" stroke="#FF6B66" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
<text x="76" y="536" font-size="17" font-weight="600" fill="#F0F6FC" text-anchor="start">With a free Apple ID, the app keeps working for 7 days.</text>
<text x="76" y="561" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="start">Then press Run in Xcode again. Your data stays.</text>
<text x="76" y="582" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="start">A paid Apple Developer Program account keeps it going for a year.</text>
</svg>
