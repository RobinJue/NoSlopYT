<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hold to scan</title>
<desc id="d">Hold the left half of a video to go back at 2 times speed, the right half to go forward at 2 times speed. Let go to carry on from there.</desc>
