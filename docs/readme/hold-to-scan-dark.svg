<line x1="360" y1="36" x2="360" y2="179" stroke="#6E7781" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="202" y1="201" x2="518" y2="201" stroke="#3D444D" stroke-width="5" stroke-linecap="round"/>
<line x1="202" y1="201" x2="375.8" y2="201" stroke="#FF6B66" stroke-width="5" stroke-linecap="round"/>
<circle cx="375.8" cy="201" r="7.5" fill="#0D1117" stroke="#FF6B66" stroke-width="3"/>
<path d="M272,66 L256,82 L272,98" fill="none" stroke="#FF6B66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M292,66 L276,82 L292,98" fill="none" stroke="#FF6B66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="270" y="132" font-size="24" font-weight="700" fill="#FF6B66" text-anchor="middle">2×</text>
<circle cx="270" cy="166" r="20" fill="none" stroke="#FF6B66" stroke-opacity="0.4" stroke-width="2"/>
<circle cx="270" cy="166" r="10" fill="#FF6B66"/>
<path d="M448,66 L464,82 L448,98" fill="none" stroke="#FF6B66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M428,66 L444,82 L428,98" fill="none" stroke="#FF6B66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="132" font-size="24" font-weight="700" fill="#FF6B66" text-anchor="middle">2×</text>
<circle cx="450" cy="166" r="20" fill="none" stroke="#FF6B66" stroke-opacity="0.4" stroke-width="2"/>
<circle cx="450" cy="166" r="10" fill="#FF6B66"/>
<text x="270" y="259" font-size="16" font-weight="600" fill="#F0F6FC" text-anchor="middle">Hold the left half</text>
<text x="270" y="280" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="middle">to go back at 2×</text>
<text x="450" y="259" font-size="16" font-weight="600" fill="#F0F6FC" text-anchor="middle">Hold the right half</text>
<text x="450" y="280" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="middle">to go forward at 2×</text>
<text x="360" y="323" font-size="14.5" font-weight="400" fill="#9DA7B3" text-anchor="middle">Let go to carry on from there.</text>
</svg>
